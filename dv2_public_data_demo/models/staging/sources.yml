version: 2

## NOTE: After mounting CARTO NYC Taxi + NYC Taxi Zones from Snowflake Marketplace,
## confirm the exact database/schema/table identifiers each listing creates and update
## the `database`, `schema`, and `name`/`identifier` fields below.
sources:
  - name: SNOWFLAKE_PUBLIC_DATA_FREE
    description: >
      Snowflake Public Data Free account (free, zero-copy mount). Contains the same
      underlying data as the CARTO NYC Taxi and NYC Taxi Zones listings on Snowflake
      Marketplace, but with different database/schema/table identifiers. If using this
      source instead of the Marketplace listings, update the `database`, `schema`, and
      `name`/`identifier` fields below to match those in the SNOWFLAKE_PUBLIC_DATA_FREE
      account.
    database: SNOWFLAKE_PUBLIC_DATA_FREE     # [Needs data] verify against the mount
    schema: PUBLIC_DATA_FREE                          # [Needs data] verify
    tables:
      - name: IRS_FORM990_ATTRIBUTES   # [Needs data] verify
        description: One row per TLC-licensed taxi trip.
      - name: IRS_FORM990_INDEX        # [Needs data] verify
        description: One row per taxi, with static attributes like license type and base location.
      - name: IRS_FORM990_TIMESERIES     # [Needs data] verify
        description:       # [Needs data] verify
      - name: IRS_FORM990_LOANS_AND_NOTES # [Needs data] verify
        description:                    # [Needs data] verify
      - name: IRS_FORM990_INVESTMENTS     # [Needs data] verify
        description:                    # [Needs data] verify